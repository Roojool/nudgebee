# Fake OpenAI-compatible LLM for llm-server load tests, so a run costs no tokens and
# never reaches a real model or runs real tools. It builds
# llm/llm-server/loadtest/mock-oauth-gateway from source at start-up (the program is
# standard-library only), so no image has to be built or pushed.
#
#   kubectl -n nudgebee create configmap loadtest-mock-llm \
#     --from-file=llm/llm-server/loadtest/mock-oauth-gateway/main.go
#   kubectl -n nudgebee apply -f loadtest/k8s/mock-llm.yaml
#
# Remove it with: kubectl -n nudgebee delete -f loadtest/k8s/mock-llm.yaml && \
#   kubectl -n nudgebee delete configmap loadtest-mock-llm
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-mock-llm
  labels: { app.kubernetes.io/name: loadtest-mock-llm }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loadtest-mock-llm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loadtest-mock-llm }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mock
          image: golang:1.26-alpine
          command: ["sh", "-c", "cp /src/main.go /tmp/main.go && cd /tmp && exec go run main.go"]
          env:
            - { name: HOME, value: /tmp }
            - { name: GOCACHE, value: /tmp/.cache/go-build }
            - { name: GOPATH, value: /tmp/go }
            - { name: GOTOOLCHAIN, value: local }
            # Model-like latency per LLM call. Real calls take several seconds; with 0 the
            # test never builds up the in-flight conversations that load llm-server.
            - { name: MOCK_GW_CANNED_DELAY, value: "5s" }
            - { name: MOCK_GW_TOKEN_TTL_SECONDS, value: "3600" }
          ports:
            - { name: http, containerPort: 9990 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: src, mountPath: /src, readOnly: true }
      volumes:
        - name: src
          configMap: { name: loadtest-mock-llm }
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest-mock-llm
  labels: { app.kubernetes.io/name: loadtest-mock-llm }
spec:
  selector: { app.kubernetes.io/name: loadtest-mock-llm }
  ports:
    - { name: http, port: 9990, targetPort: http }
