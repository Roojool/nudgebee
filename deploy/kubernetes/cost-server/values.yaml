# Default values for cost-server.
# This is a YAML-formatted file.

replicaCount: 1

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []

image:
  repository: nudgebee-cost-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  annotations: {}
  name: ''

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 9003

secretName: 'nudgebee'

# When true, cost-server routes OpenCost's Prometheus queries through
# services-server's observability metrics_query API (via an in-process
# Prometheus-API shim) instead of relay-server's /prometheus facade. Requires
# SERVICE_API_SERVER_URL and ACTION_API_SERVER_TOKEN (both already provided by
# the shared `nudgebee` secret).
useObservabilityMetrics: false

# Per cluster, the engine caches one upstream costmodel.Accesses and holds the
# PromQL allocation result (~1.5k pod rows) in memory; memory grows with the number
# of clusters served. Tune limits.memory after the multi-cluster memory check.
# Small-tier defaults. See docs/sizing-and-tiers.md.
# Flat and cheap on every measured deployment: 33-64Mi average, 154Mi peak, CPU
# under 3m average, so the old 512Mi request reserved ~10x the need.
# The 2Gi limit is retained even though measurement would justify far less: a
# ceiling is not reserved capacity, so an over-generous one costs nothing at
# steady state, while a tight one is an OOMKill. See the "never lower a memory
# limit" rule in docs/sizing-and-tiers.md.
resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 50m
    memory: 100Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}
