# Default values for relay-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Ed25519 signing of requests forwarded to native k8s agents, so agents can
# authorize UI-triggered workload mutations. Additive + backward-compatible
# (old/unkeyed agents ignore it), so on by default; set false to disable.
signing:
  signK8sEnabled: true

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.10-alpine'
    curl: 'ghcr.io/nudgebee/curl:8.10.1'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'

image:
  repository: nudgebee-relay-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: 'nginx'
  # -- Annotations to be added to the ingress.
  # The server-snippet keeps the public listener to the only routes that must
  # reach the relay from outside the cluster: agents and forager dial /register
  # over WSS, and load balancers probe /status. Every other route — /request,
  # /prometheus/api/v1/*, /prometheus-v2/*, /grafana/*, /api/proxy/* and
  # /debug/pprof/* — is called by in-cluster services over
  # RELAY_SERVER_ENDPOINT (http://relay-server:8080), which does not traverse
  # this ingress, so denying them at the edge costs nothing.
  #
  # This lives here rather than in each environment's values because it is the
  # safe default: an environment that omits it is silently exposed. Helm
  # deep-merges annotations, so overrides that set only cert-manager and
  # force-ssl-redirect still inherit it, and an environment that needs a
  # different allowlist can replace this key outright.
  annotations:
    cert-manager.io/issuer: cert-letsencrypt-issuer
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    # Matches on $uri, not $request_uri: $uri is the normalised path with the
    # query string stripped, which is what the anchors below need — against
    # $request_uri a legitimate /register?x=1 would fail (register)($|/) and
    # 404 the agent fleet. The ($|/) anchors keep the allowlist to whole path
    # segments so a future route such as /statuspage is not served publicly by
    # accident.
    nginx.ingress.kubernetes.io/server-snippet: |
      if ($uri !~ ^/(\.well-known/acme-challenge/|(register|status)($|/))) {
        return 404;
      }

  # -- Ingress host configuration.
  # @default -- See [values.yaml](values.yaml).
  hosts: []
  # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []

secretName: 'nudgebee'

resources:
  limits:
    memory: 1000Mi
  requests:
    cpu: 100m
    memory: 500Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}
