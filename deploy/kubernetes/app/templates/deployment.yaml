{{- /*
Branding is configured only through the tenant_branding_override table now. The
app no longer reads a theme file per host or per deployment, so these values
would be silently ignored and the host would render the house brand. Refuse to
render instead, so the change is noticed at deploy time rather than on a
partner's own domain.
*/}}
{{- if .Values.branding.hostMap }}
{{- fail "branding.hostMap is no longer supported: branding comes from the database. Save a tenant_branding_override row for each hostname (super-admin branding_upsert_override action), then remove branding.hostMap. Keep branding.tenants to serve the image files the row points at." }}
{{- end }}
{{- if .Values.branding.defaultTenant }}
{{- fail "branding.defaultTenant is no longer supported: branding comes from the database. Save a tenant_branding_override row for each hostname (super-admin branding_upsert_override action), then remove branding.defaultTenant. Keep branding.tenants to serve the image files the row points at." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (( default .Values.global.imagePullSecrets .Values.imagePullSecrets )) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: nextjs-static-init
          image: {{ include "imageName" . }}
          command: ["sh", "-c", "cp -r /app/.next /nextjs-static && cp -r /app/public /nextjs-static"]  #Copy both the `.next` and `public` directories
          volumeMounts:
            - name: nextjs-static
              mountPath: /nextjs-static        
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "imageName" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "nudgebee.secretName" . | quote }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "app.fullname" . }}-extra-env
            {{- end }}
          {{- if or .Values.adminEmailSecret .Values.statusNotice.configMapName }}
          env:
            {{- with .Values.adminEmailSecret }}
            # Pins the dummy-credentials login to the admin address.
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: ADMIN_EMAIL
                  optional: true
            {{- end }}
            {{- if .Values.statusNotice.configMapName }}
            - name: STATUS_NOTICE_FILE
              value: /etc/nudgebee/status/notice.json
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.serverPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nextjs-static
              mountPath: /nextjs-static
            {{- if .Values.statusNotice.configMapName }}
            # Directory mount, deliberately NOT subPath: subPath mounts do not
            # receive ConfigMap updates, which would force a pod restart to
            # publish an incident notice.
            - name: status-notice
              mountPath: /etc/nudgebee/status
              readOnly: true
            {{- end }}
            {{- if .Values.branding.enabled }}
            # One mount per brand kit — a deployment fronting several partner
            # hostnames carries all of their kits at once.
            #
            # Directory mounts, deliberately NOT subPath: subPath mounts do not
            # receive ConfigMap updates, so editing a theme would need a pod
            # restart. Nothing is shadowed — the image ships no
            # public/branding/<tenant>/ directory for a white-label tenant.
            #
            # Only the app container. nginx serves `/public/` from its own copy
            # of the static tree; `/branding/<tenant>/…` does not match that
            # location and is proxied to Next.js in this container.
            {{- range .Values.branding.tenants }}
            - name: tenant-branding-{{ .slug }}
              mountPath: /app/public/branding/{{ .slug }}
              readOnly: true
            {{- end }}
            {{- end }}
        - name: nginx  # Nginx sidecar container
          image: {{ .Values.nginx.image.registry }}/{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: web
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nextjs-static
              mountPath: /app
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true              
          resources: {{- toYaml .Values.nginx.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nextjs-static
          emptyDir: {}
        {{- if .Values.statusNotice.configMapName }}
        # `optional` so the pod still starts when no notice ConfigMap exists —
        # the normal state. No notice simply means no banner.
        - name: status-notice
          configMap:
            name: {{ .Values.statusNotice.configMapName | quote }}
            optional: true
        {{- end }}
        {{- if .Values.branding.enabled }}
        # NOT optional: a missing brand kit would silently start the pod with
        # Nudgebee branding on a white-label deployment. Fail to schedule instead.
        {{- range .Values.branding.tenants }}
        - name: tenant-branding-{{ .slug }}
          configMap:
            name: {{ .configMapName | quote }}
        {{- end }}
        {{- end }}
        - name: nginx-config
          configMap:
            name: {{ include "app.fullname" $ }}-nginx-config        
