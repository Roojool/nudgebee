name: RAG-Server CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - llm/rag-server/**
      - .github/workflows/rag-server.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "llm/rag-server/uv.lock"

      - name: Install dependencies with uv
        working-directory: ./llm/rag-server
        run: |
          # Sync the project env to uv.lock exactly (no re-resolve), with
          # dev/test extras for linting and testing.
          uv sync --frozen --all-extras

      - name: Run linters
        working-directory: ./llm/rag-server
        run: |
          uv run black --check .
          uv run flake8 .
          uv run mypy ./**/*.py --namespace-packages
