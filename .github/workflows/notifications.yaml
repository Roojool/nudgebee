name: Notifications Server CI
on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - notifications-server/**
      - .github/workflows/notifications.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notifications-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real broker for tests/test_consumer_reconnect.py (consumer count stays one
    # across broker reconnects). Same RabbitMQ version as the chart.
    services:
      rabbitmq:
        image: public.ecr.aws/docker/library/rabbitmq:3.13.7
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          # postgresql-server-dev-all is a metapackage that pulls in
          # `postgresql-common (= 257build1.1)` from Ubuntu repos, which
          # conflicts with `postgresql-common (= 290.pgdg24.04+1)` already
          # installed from the pgdg PPA on the runner image. Pinning to
          # a specific server-dev version avoids the dependency clash.
          sudo apt-get install -y --no-install-recommends build-essential postgresql-server-dev-16 libsodium-dev

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: ./notifications-server/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('./poetry.lock') }}

      - name: Install dependencies
        working-directory: ./notifications-server
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        working-directory: ./notifications-server
        run: poetry install --no-interaction

      - name: Run linters
        working-directory: ./notifications-server
        run: |
          poetry run black --check .
          poetry run flake8 .

      - name: Run tests
        working-directory: ./notifications-server
        # The broker tests skip when RABBIT_MQ_TEST_HOST is unset; here it is set,
        # so a missing broker fails them.
        env:
          RABBIT_MQ_TEST_HOST: 127.0.0.1
        run: poetry run pytest -q
